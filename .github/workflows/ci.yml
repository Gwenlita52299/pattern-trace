name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # nightly 性能档（PERF-01/02）：03:00 UTC
    - cron: "0 3 * * *"
  # 手动触发（验证 perf-nightly 等 schedule 档，无需等 cron）
  workflow_dispatch:

jobs:
  lint-test-backend:
    runs-on: ubuntu-latest
    services:
      # 单测依赖真实 Postgres（BE-42/auth 等用例）。
      # 库名必须是 patterntrace_test：单测里有全表清理（DELETE FROM judgments），
      # scripts/db_guard.py 按库名放行（patterntrace_test / pt_e2e / *_test），
      # 指向开发库会直接报错而不是静默清空。CI 的库虽是临时的，同名约定保证
      # 本地与 CI 行为一致。
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pt
          POSTGRES_PASSWORD: pt
          POSTGRES_DB: patterntrace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pt" --health-interval 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Migrate database
        run: DATABASE_URL=postgresql://pt:pt@localhost:5432/patterntrace_test JWT_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef uv run alembic upgrade head
      - name: Lint
        run: uv run ruff check backend/
      - name: OpenAPI codegen (CT-01)
        run: |
          JWT_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef uv run python -m scripts.gen_api_types
          git diff --exit-code -- frontend/types/api.d.ts \
            tests/unit/__snapshots__/openapi.json \
            || { echo "::error::OpenAPI drift — run 'python -m scripts.gen_api_types' and commit"; exit 1; }
      - name: Unit tests (含契约测试 CT-01~03)
        env:
          DATABASE_URL: postgresql://pt:pt@localhost:5432/patterntrace_test
        run: uv run pytest tests/unit --cov=backend --cov-report=term-missing
      - name: Alembic offline SQL check
        run: |
          JWT_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef DATABASE_URL=postgresql://ci:ci@localhost/ci \
            uv run alembic upgrade head --sql > /dev/null

  lint-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Lint (issue #57)
        run: npm run lint
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - name: Unit tests (vitest，issue #57)
        run: npm test
        working-directory: frontend
      - name: Build（rewrites 等构建期问题的门禁）
        run: npm run build
        working-directory: frontend
        env:
          API_PROXY_URL: http://localhost:8000

  e2e:
    needs: [lint-test-backend, lint-test-frontend]
    runs-on: ubuntu-latest
    # 完整业务闭环（issue #78）：分析→判断→子图→PDF/HTML 报告 + 独立
    # worker 队列形态，全部在隔离 compose project 内真实走一遍
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run full E2E (isolated compose project)
        run: bash infra/verify_e2e_local.sh
        timeout-minutes: 25
      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: /tmp/pt-e2e/
          if-no-files-found: ignore
          retention-days: 5

  perf-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pt
          POSTGRES_PASSWORD: pt
          POSTGRES_DB: patterntrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pt" --health-interval 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Migrate database
        run: DATABASE_URL=postgresql://pt:pt@localhost:5432/patterntrace JWT_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef uv run alembic upgrade head
      - name: PERF-01 report capacity (fixture 档)
        env:
          DATABASE_URL: postgresql://pt:pt@localhost:5432/patterntrace
          JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: uv run python tests/performance/perf_phase6.py PERF-01
      # PERF-02 的达标前提是 ≥10k 行（spec §2.2）：此前没有灌数步骤，
      # 该用例在 nightly 永远 [skip]——补上 seed 才真正跑起来。
      - name: Seed stress volume (10k judgments for PERF-02)
        env:
          DATABASE_URL: postgresql://pt:pt@localhost:5432/patterntrace
          JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: uv run python tests/performance/seed_volume.py
      - name: PERF-02 query latency (万级 judgment)
        env:
          DATABASE_URL: postgresql://pt:pt@localhost:5432/patterntrace
          JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          LLM_PROVIDER: mock
          GRAPH_DATA_MODE: fixture
        run: uv run python tests/performance/perf_phase6.py PERF-02
