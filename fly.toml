# Fly.io 部署清单 — backend（API）与 worker 共用镜像。
# 首次部署：
#   fly launch --no-deploy --name <app-name>
#   fly secrets set JWT_SECRET=... DATABASE_URL=... REDIS_URL=... \
#     LLM_PROVIDER=ollama LLM_BASE_URL=http://<ollama-app>.fly.internal:11434
#   fly deploy
# 注意：Postgres / Redis / Ollama 使用 Fly 托管实例（fly postgres create /
# Upstash Redis / 独立 ollama app），本仓库 docker-compose 仅用于本地开发。
app = "patterntrace-api"
primary_region = "nrt"

[build]
  dockerfile = "infra/Dockerfile.backend"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# 迁移在 release 阶段单实例执行（spec infra §4）；app 进程不再自带 alembic，
# 多实例并发迁移风险由 release_command + env.py 的 advisory lock 双保险消除
[deploy]
  release_command = "alembic upgrade head"

[processes]
  app = "uvicorn backend.api.app:create_app --factory --host 0.0.0.0 --port 8000"
  worker = "arq workers.worker.WorkerSettings"
