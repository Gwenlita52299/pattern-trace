[project]
name = "patterntrace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "anyio>=4.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "arq>=0.26",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "bcrypt>=4.1",
    "async-lru>=2.0",
    "pgvector>=0.3",
    "pyarrow>=16.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "locust>=2.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["backend"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
# CI 只对 backend/ 收口（与 .github/workflows/ci.yml 一致）；
# B008 是 FastAPI Depends 惯用法，BLE001/S110 为刻意的降级容忍路径。
exclude = [".venv", "frontend", ".cache", "output"]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["B008", "BLE001", "S110", "SIM102"]
