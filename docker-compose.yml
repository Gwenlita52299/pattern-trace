services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pt
      POSTGRES_PASSWORD: pt
      POSTGRES_DB: patterntrace
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pt -d patterntrace"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # issue #63：本地推理可选项。生产不拉起（profile 门控），默认走 deepseek。
  # 首启从 HF 下载 ~16GB 模型；本地已缓存（~/.cache/huggingface）可 bind-mount 复用
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["local-llm"]
    # 判决缓存 key 含 model 名：--alias 必须与 backend/worker 的 LLM_MODEL 一致
    command: >
      -hf unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M
      --alias qwen3.8-27b --jinja
      -c 8192 -ngl 99
      --temp 1.0 --top-p 0.95 --top-k 20
      --host 0.0.0.0 --port 8080
    ports: ["8080:8080"]
    volumes:
      - llamacpp_models:/root/.cache/llama.cpp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      # 模型加载入内存需数分钟（16GB），先给足宽限
      start_period: 300s

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://pt:pt@db:5432/patterntrace
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      # LLM_API_KEY 由 Settings 声明读取（环境变量优先于 .env），必须在此透传进容器
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - GRAPH_DATA_MODE=${GRAPH_DATA_MODE:-fixture}
      - ESPLORA_API_URL=${ESPLORA_API_URL:-https://mempool.space/api}
      # issue #79：live 模式 analyze 入口地址活跃度预检阈值（仅 backend 需要）
      - ADDRESS_TX_COUNT_LIMIT=${ADDRESS_TX_COUNT_LIMIT:-200}
      # 出站 HTTP 走宿主机代理（httpx trust_env 自动拾取）；NO_PROXY 保护内网
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
      # RT-04 模型锁：容器内 provider 配置必须与 DB 已写入向量的模型一致
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-stub}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-liquid/lfm-2.5-embedding-350m}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:?set-in-.env}
      # 管理端保存 provider API Key 的加密钥匙（可选；缺失时面板不能存密钥）
      - SECRETS_KEY=${SECRETS_KEY:-}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      # issue #22：显式指向共享卷挂载点，不依赖 WORKDIR 相对路径的隐式巧合
      - REPORTS_DIR=/app/output/reports
    command: >
      sh -c "alembic upgrade head &&
             uvicorn backend.api.app:create_app --factory --host 0.0.0.0 --port 8000"
    volumes:
      # issue #22：报告文件由 worker 写、API 读，必须共享持久化存储
      - report_files:/app/output/reports
      # graphormer_v2 检索数据（pooled/ego npz）：retriever 查询侧必需
      - ./ingest/seed/graphormer_v2:/app/ingest/seed/graphormer_v2:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://pt:pt@db:5432/patterntrace
      - REDIS_URL=redis://redis:6379/0
      # issue #74：分析与报告分队列/分进程（报告渲染不挤占交互式分析槽位）
      - ARQ_QUEUE_ANALYSIS=q_analysis
      - ARQ_MAX_JOBS=4
      - ARQ_QUEUE_LLM=q_llm
      # worker 与 backend 的判决缓存 key 含 model 名，两侧必须一致；
      # LLM 配置与 backend 保持同一组变量，保证两种执行形态可互换
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - GRAPH_DATA_MODE=${GRAPH_DATA_MODE:-fixture}
      - ESPLORA_API_URL=${ESPLORA_API_URL:-https://mempool.space/api}
      # 出站 HTTP 走宿主机代理（httpx trust_env 自动拾取）；NO_PROXY 保护内网
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
      # worker 内 orchestration 跑 Retriever，embedding 配置必须与 backend 一致
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-stub}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-liquid/lfm-2.5-embedding-350m}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:?set-in-.env}
      # worker 需要在任务执行时解出管理端配置的 provider 密钥
      - SECRETS_KEY=${SECRETS_KEY:-}
      - REPORTS_DIR=/app/output/reports
    volumes:
      - report_files:/app/output/reports
      # graphormer_v2 检索数据（pooled/ego npz）：orchestration 检索必需
      - ./ingest/seed/graphormer_v2:/app/ingest/seed/graphormer_v2:ro
    command: arq workers.worker.AnalysisWorkerSettings
    healthcheck:
      test: ["CMD-SHELL", "arq --check workers.worker.AnalysisWorkerSettings"]
      interval: 10s
      timeout: 5s
      retries: 5

  # issue #74：报告专用 worker（队列 q_report，默认单并发）。独立进程保证
  # 报告渲染（CPU 密集）不会占用分析 worker 的槽位；提高报告吞吐只需给
  # 本服务加 ARQ_REPORT_MAX_JOBS。
  worker-report:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://pt:pt@db:5432/patterntrace
      - REDIS_URL=redis://redis:6379/0
      - ARQ_QUEUE_REPORT=q_report
      - ARQ_REPORT_MAX_JOBS=1
      - REPORTS_DIR=/app/output/reports
      - JWT_SECRET=${JWT_SECRET:?set-in-.env}
    volumes:
      - report_files:/app/output/reports
    command: arq workers.worker.ReportWorkerSettings
    healthcheck:
      test: ["CMD-SHELL", "arq --check workers.worker.ReportWorkerSettings"]
      interval: 10s
      timeout: 5s
      retries: 5

  # issue #75：模式索引重算专用 worker（队列 q_index）。索引要调 embedding
  # （网络）与 graphormer 前向（CPU/GPU），与交互式分析争资源会直接抬高
  # 用户可见延迟，因此独立进程；环境变量与 worker 保持一致（同一套
  # embedding 模型口径，否则库内向量与查询侧不在同一空间）。
  worker-index:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://pt:pt@db:5432/patterntrace
      - REDIS_URL=redis://redis:6379/0
      - ARQ_QUEUE_INDEX=q_index
      - ARQ_INDEX_MAX_JOBS=2
      - JWT_SECRET=${JWT_SECRET:?set-in-.env}
      - GRAPH_DATA_MODE=${GRAPH_DATA_MODE:-fixture}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-stub}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-liquid/lfm-2.5-embedding-350m}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
    volumes:
      # 索引重算走 graphormer 在线前向（需要同权重模型/ego 语料）
      - ./ingest/seed/graphormer_v2:/app/ingest/seed/graphormer_v2:ro
    command: arq workers.worker.IndexWorkerSettings
    healthcheck:
      test: ["CMD-SHELL", "arq --check workers.worker.IndexWorkerSettings"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # rewrites 目的地烘焙于构建期（见 next.config.mjs）：容器网络内
      # localhost 不是后端，必须用服务名
      args:
        - API_PROXY_URL=http://backend:8000
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  llamacpp_models:
  report_files:
